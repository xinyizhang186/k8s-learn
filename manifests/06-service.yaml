# =============================================================================
# 06 — Service：稳定的网络入口与负载均衡
# -----------------------------------------------------------------------------
# Service 为一组 Pod 提供固定 IP 和 DNS 名，并在后端 Pod 间做负载均衡。
# 本文件含三种 Service 类型 + 1 个 Headless Service：
#   1. redis (ClusterIP, Headless) — 给 StatefulSet 用，解析到具体 Pod IP
#   2. web (ClusterIP) — 集群内部访问 Web
#   3. web-nodeport (NodePort) — 集群外部通过节点端口访问
# 命令: kubectl -n learn-space get svc
#       kubectl -n learn-space exec deploy/web -- curl -s redis:6379
# =============================================================================

# Headless Service：clusterIP: None，DNS 查询返回 Pod IP 列表（StatefulSet 必需）
apiVersion: v1
kind: Service
metadata:
  name: redis # StatefulSet.spec.serviceName 必须匹配此名
  namespace: learn-space
spec:
  clusterIP: None # Headless：不分配 VIP，直接解析到 Pod
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
# ClusterIP Service：集群内部访问 Web（默认类型）
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: learn-space
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080
      name: http
---
# NodePort Service：在每个节点开端口，集群外部可访问 (30000-32767)
apiVersion: v1
kind: Service
metadata:
  name: web-nodeport
  namespace: learn-space
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080 # 节点端口（可省略由 k8s 分配）
