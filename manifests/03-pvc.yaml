# =============================================================================
# 03 — PersistentVolumeClaim (PVC)：声明式申请持久存储
# -----------------------------------------------------------------------------
# PVC 是用户对存储的"申请单"，由 StorageClass 动态供给 PV。
#
# 本文件演示【手动声明 PVC】的方式（适用于 Deployment 等）。
# 注意：本 PVC 不被实际挂载（仅为演示声明流程）；
# Redis StatefulSet 在 04 文件中用 volumeClaimTemplates 自动生成独立 PVC，是另一种方式。
# 两种方式对比：
#   - 手动 PVC（本文件）：先创建 PVC，再在 Deployment volume 中引用 PVC 名称
#   - volumeClaimTemplates（04）：StatefulSet 专属，为每个 Pod 自动生成 PVC，无需手动管理
# 命令: kubectl -n learn-space get pvc
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: learn-space
spec:
  accessModes:
    - ReadWriteOnce # 单节点读写（块存储典型模式）
  resources:
    requests:
      storage: 256Mi
