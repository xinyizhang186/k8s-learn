# =============================================================================
# 09 — DaemonSet：每个节点跑一个 Pod
# -----------------------------------------------------------------------------
# DaemonSet 确保每个（或符合条件的）节点上运行一个 Pod 副本。
# 典型用途：日志采集、监控代理、网络插件、存储驱动。
# 这里部署一个"节点信息采集器"，每 10s 打印节点名与负载，模拟日志 agent。
# 命令: kubectl -n learn-space get ds
#       kubectl -n learn-space logs -l app=node-info -f --tail=20
# =============================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-info
  namespace: learn-space
  labels:
    app: node-info
spec:
  selector:
    matchLabels:
      app: node-info
  template:
    metadata:
      labels:
        app: node-info
    spec:
      # 演示容忍：kind 控制面节点默认有 NoSchedule 污点，加容忍可让其也调度
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: collector
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "[daemonset] 节点信息采集器启动 on $(hostname)"
              while true; do
                echo "$(date '+%H:%M:%S') node=$(hostname) loadavg=$(cat /proc/loadavg | awk '{print $1}')"
                sleep 10
              done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
