# =============================================================================
# 02 — Secret：敏感信息存储（Base64 编码，非加密）
# -----------------------------------------------------------------------------
# Secret 用于存放密码、Token、证书等敏感数据。
# 注意：默认仅 Base64 编码，并非加密！生产应配合 RBAC 限制访问或启用 etcd 加密。
# 命令: kubectl -n learn-space get secret
#       kubectl -n learn-space edit secret db-secret（可见明文需 base64 解码）
# =============================================================================

# 注意：base64 编码不等于加密，下面的值是 echo -n 'p@ssw0rd' | base64 的结果
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: learn-space
type: Opaque
stringData:
  # stringData 写明文，k8s 自动 base64 编码后存储（比手动 data: 编码更方便）
  DB_PASSWORD: "p@ssw0rd-12345"
  DB_USER: "learnadmin"
