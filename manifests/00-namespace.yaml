# =============================================================================
# 00 — Namespace：资源隔离的逻辑边界
# -----------------------------------------------------------------------------
# Namespace 用于在物理集群中划分"虚拟集群"，便于按团队/环境隔离资源与权限。
# 本项目所有资源部署在 learn-space 命名空间，互不干扰。
# 命令: kubectl get ns
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: learn-space
  labels:
    app.kubernetes.io/name: k8s-learn
