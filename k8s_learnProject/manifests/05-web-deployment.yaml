# =============================================================================
# 05 — Deployment：无状态应用部署（Web 访客计数器）★ 核心知识点最密集的文件
# -----------------------------------------------------------------------------
# 本文件演示一个 Deployment 中尽可能多的知识点：
#   1. 副本管理 + 滚动更新策略 (RollingUpdate)
#   2. 多容器 Pod：业务容器 + sidecar (日志边车)
#   3. initContainer：主容器启动前等待 Redis 就绪
#   4. ConfigMap 注入：envFrom (环境变量) + volume (文件)
#   5. Secret 注入：envFrom
#   6. Downward API：把 Pod 资源请求/元信息注入为环境变量
#   7. 探针分离：liveness (进程存活) / readiness (Redis 连通才接流量)
#   8. 资源 requests/limits：调度与限流依据
#   9. securityContext：非 root + 禁止提权
#  10. lifecycle preStop：优雅关闭
#  11. podAntiAffinity：副本尽量打散到不同节点
# 命令: kubectl -n learn-space rollout status deploy/web
#       kubectl -n learn-space scale deploy/web --replicas=4
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: learn-space
  labels:
    app: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1 # 滚动更新时最多超出期望副本数 1 个
      maxUnavailable: 0 # 更新期间不允许不可用（零停机）
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      # 副本反亲和：尽量把 2 副本调度到不同节点，提高可用性
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: web
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      # ---- initContainer：主容器启动前执行，完成即退出 ----
      # 等待 Redis Service 可解析，避免 Web 启动时 Redis 未就绪
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nslookup redis.learn-space.svc.cluster.local; do echo 'waiting for redis...'; sleep 2; done"
      # ---- 业务容器 + sidecar 共享 Pod 网络与存储 ----
      containers:
        - name: web
          image: k8s-learn/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          # 环境变量：ConfigMap + Secret 整体注入
          envFrom:
            - configMapRef:
                name: web-config
            - secretRef:
                name: db-secret
          # Downward API：把 Pod 元信息与资源请求注入为环境变量
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # 资源请求通过 Downward API 的 resourceFieldRef 注入
            - name: CPU_REQUEST
              valueFrom:
                resourceFieldRef:
                  resource: requests.cpu
            - name: MEM_REQUEST
              valueFrom:
                resourceFieldRef:
                  resource: requests.memory
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          # 存活探针：进程能响应即健康
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          # 就绪探针：Redis 连通才接流量（/readyz 检查 redis）
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          # 优雅关闭：先等流量切走，再让进程处理 SIGTERM
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          # 挂载 ConfigMap 文件 + 共享日志目录给 sidecar
          volumeMounts:
            - name: config-files
              mountPath: /etc/config
              readOnly: true
            - name: shared-logs
              mountPath: /var/log/app
        # ---- sidecar 容器：与业务容器同 Pod，共享网络/卷 ----
        # 演示多容器 Pod 模式：边车持续读取业务容器写入的日志并转发到 stdout
        - name: log-sidecar
          image: busybox:1.36
          command: ["sh", "-c", "tail -n+1 -f /var/log/app/access.log"]
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/app
              readOnly: true
      volumes:
        # ConfigMap 作为 volume 挂载（每个 data key 变成一个文件）
        - name: config-files
          configMap:
            name: web-config-files
        # emptyDir：Pod 级别的临时共享存储，Pod 删除即消失
        - name: shared-logs
          emptyDir: {}
      terminationGracePeriodSeconds: 30
