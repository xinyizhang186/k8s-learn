# =============================================================================
# 12 — RBAC：基于角色的访问控制
# -----------------------------------------------------------------------------
# RBAC 四要素：
#   - ServiceAccount：Pod 的身份
#   - Role：命名空间内的权限集合
#   - RoleBinding：把 Role 绑定给 ServiceAccount
#   (ClusterRole/ClusterRoleBinding 则是集群范围)
# 这里创建一个只读 ServiceAccount，并让 CronJob 用它（演示最小权限原则）。
# 命令: kubectl -n learn-space get sa,role,rolebinding
#       kubectl -n learn-space auth can-i list pods --as=system:serviceaccount:learn-space:reader
# =============================================================================
# ServiceAccount：Pod 的服务账号身份
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reader
  namespace: learn-space
---
# Role：命名空间内的权限（只能 get/list/watch）
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: learn-space
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
# RoleBinding：把 Role 绑定给 ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reader-binding
  namespace: learn-space
subjects:
  - kind: ServiceAccount
    name: reader
    namespace: learn-space
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
---
# 演示：用该 ServiceAccount 跑一个 Pod，验证它只能 list pods
apiVersion: v1
kind: Pod
metadata:
  name: rbac-test
  namespace: learn-space
spec:
  serviceAccountName: reader # 指定 ServiceAccount
  restartPolicy: Never
  containers:
    - name: kubectl
      image: bitnami/kubectl:latest
      command:
        - sh
        - -c
        - |
          echo "[rbac] 尝试列出 pods (应有权限):"
          kubectl get pods -n learn-space
          echo "[rbac] 尝试删除 pod (应被拒绝):"
          kubectl delete pod -n learn-space web-0 2>&1 || true
          echo "[rbac] 验证完成"
