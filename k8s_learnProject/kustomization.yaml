# =============================================================================
# Kustomization：聚合所有 manifest，一键 apply / 渲染
# -----------------------------------------------------------------------------
# 用法:
#   kubectl apply -k k8s_learnProject/                    # 部署全部
#   kubectl kustomize k8s_learnProject/                   # 仅渲染预览
#   kubectl delete -k k8s_learnProject/                   # 清理全部
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: learn-space
resources:
  - manifests/00-namespace.yaml
  - manifests/01-configmap.yaml
  - manifests/02-secret.yaml
  - manifests/03-pvc.yaml
  - manifests/04-redis-statefulset.yaml
  - manifests/05-web-deployment.yaml
  - manifests/06-service.yaml
  - manifests/07-ingress.yaml
  - manifests/08-hpa.yaml
  - manifests/09-daemonset.yaml
  - manifests/10-job.yaml
  - manifests/11-cronjob.yaml
  - manifests/12-rbac.yaml
  - manifests/13-networkpolicy.yaml
commonLabels:
  app.kubernetes.io/part-of: k8s-learn
