[project]
name = "knowledgepilot"
version = "0.1.0"
description = "KnowledgePilot: real scholarly data search and evidence reasoning Agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.5.0",
  "httpx>=0.27.0",
  "sqlalchemy>=2.0.0",
  "redis>=5.0.0",
  "pymysql>=1.1.0",
  "streamlit>=1.39.0",
  "requests>=2.32.0",
  "pypdf>=6.0.0",
  "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "harness*"]

[project.scripts]
knowledgepilot-api = "app.api.main:run"
knowledgepilot-eval = "harness.evaluate:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
