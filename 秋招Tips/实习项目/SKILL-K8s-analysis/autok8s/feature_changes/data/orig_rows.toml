[AuthorizeNodeWithSelectors]
"默认值锁定" = "->true"
"排查方法" = "允许节点鉴权器使用细粒度选择符鉴权。需要启用AuthorizeWithSelectors。"
"参考资料" = "https://kubernetes.io/zh-cn/docs/reference/access-authn-authz/node/"
"详细说明" = "节点鉴权器使用细粒度选择符鉴权（需先启用 AuthorizeWithSelectors 特性）。Kubelet 只允许读取它们自己的 Node 对象，并且只允许读取绑定到其节点的 Pod。"
"建议开启" = "开启"
"补充说明" = ""
